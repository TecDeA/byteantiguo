<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de iconos · Byte</title>
<style>
  body {
    margin: 0; padding: 32px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0b0f; color: #e8e6e0;
  }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .04em; }
  p  { margin: 0 0 20px; color: #8b8b96; font-size: 14px; line-height: 1.6; }
  code { background: #1a1a21; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  button {
    font: inherit; font-weight: 700; font-size: 12px;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid #5a4520; color: #ffd79a;
    background: linear-gradient(180deg, #2b2113, #1c160c);
    cursor: pointer; transition: .18s;
  }
  button:hover { border-color: #8a6a2e; color: #fff; }
  .grid { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 30px; }
  figure { margin: 0; text-align: center; }
  canvas {
    display: block; border-radius: 18px;
    border: 1px solid #26262f; background: #0b0b0f;
    box-shadow: 0 18px 40px -20px #000;
  }
  figcaption { margin-top: 10px; font-size: 12px; color: #77777f; font-family: ui-monospace, monospace; }
</style>
</head>
<body>

<h1>Generador de iconos</h1>
<p>
  Pulsa el botón para descargar <code>icon-192.png</code>, <code>icon-512.png</code> y
  <code>apple-touch-icon.png</code>. Guárdalos en la carpeta <code>icons/</code>.
</p>

<button id="go" type="button">Generar y descargar PNG</button>

<div class="grid" id="grid"></div>

<script>
const SIZES = [
  { size: 192, name: 'icon-192.png' },
  { size: 512, name: 'icon-512.png' },
  { size: 180, name: 'apple-touch-icon.png' }
];

const img = new Image();

img.onload = () => {
  const grid = document.getElementById('grid');
  SIZES.forEach(({ size, name }) => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    canvas.getContext('2d').drawImage(img, 0, 0, size, size);

    const fig = document.createElement('figure');
    fig.appendChild(canvas);

    const cap = document.createElement('figcaption');
    cap.textContent = `${name} · ${size}×${size}`;
    fig.appendChild(cap);

    grid.appendChild(fig);
  });
};

img.onerror = () => {
  document.getElementById('grid').innerHTML =
    '<p style="color:#ff8a8a">No se pudo cargar <code>../icons/icon.svg</code>. ' +
    'Sirve la carpeta con un servidor local, no con <code>file://</code>.</p>';
};

img.src = '../icons/icon.svg';

document.getElementById('go').addEventListener('click', () => {
  SIZES.forEach(({ size, name }) => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    canvas.getContext('2d').drawImage(img, 0, 0, size, size);

    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
});
</script>
</body>
</html>
